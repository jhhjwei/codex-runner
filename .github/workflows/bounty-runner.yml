name: Bounty Runner

on:
  workflow_dispatch:
  push:
    paths:
      - '.bounty/task.json'

permissions:
  contents: read

concurrency:
  group: bounty-runner
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BOUNTY_GITHUB_TOKEN }}

    steps:
      - name: Check out control repository
        uses: actions/checkout@v4

      - name: Validate authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          LOGIN=$(gh api user --jq '.login')
          echo "login=$LOGIN" >> "$GITHUB_OUTPUT"
          echo "Authenticated as $LOGIN"

      - name: Load task
        id: task
        shell: bash
        run: |
          set -euo pipefail
          test -f .bounty/task.json
          jq -e '.upstream and .issue and .branch and .attempt_file' .bounty/task.json >/dev/null
          echo "upstream=$(jq -r '.upstream' .bounty/task.json)" >> "$GITHUB_OUTPUT"
          echo "issue=$(jq -r '.issue' .bounty/task.json)" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r '.branch' .bounty/task.json)" >> "$GITHUB_OUTPUT"
          echo "mode=$(jq -r '.mode // "claim"' .bounty/task.json)" >> "$GITHUB_OUTPUT"
          echo "attempt_file=$(jq -r '.attempt_file' .bounty/task.json)" >> "$GITHUB_OUTPUT"
          echo "script=$(jq -r '.script // ""' .bounty/task.json)" >> "$GITHUB_OUTPUT"
          echo "pr_title=$(jq -r '.pr_title // "Bounty implementation"' .bounty/task.json)" >> "$GITHUB_OUTPUT"
          echo "pr_body_file=$(jq -r '.pr_body_file // ""' .bounty/task.json)" >> "$GITHUB_OUTPUT"

      - name: Fork repository and register attempt
        id: claim
        env:
          OWNER: ${{ steps.auth.outputs.login }}
          UPSTREAM: ${{ steps.task.outputs.upstream }}
          ISSUE: ${{ steps.task.outputs.issue }}
          BRANCH: ${{ steps.task.outputs.branch }}
          ATTEMPT_FILE: ${{ steps.task.outputs.attempt_file }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ATTEMPT_FILE"
          REPO_NAME=${UPSTREAM#*/}
          FORK="$OWNER/$REPO_NAME"
          BASE=$(gh api "repos/$UPSTREAM" --jq '.default_branch')

          if ! gh api "repos/$FORK" >/dev/null 2>&1; then
            gh api --method POST "repos/$UPSTREAM/forks" >/dev/null
            for _ in $(seq 1 30); do
              gh api "repos/$FORK" >/dev/null 2>&1 && break
              sleep 2
            done
          fi
          gh api "repos/$FORK" >/dev/null

          MARKER="<!-- codex-bounty-runner:${UPSTREAM//\//-}-$ISSUE -->"
          if ! gh api "repos/$UPSTREAM/issues/$ISSUE/comments" --paginate --jq '.[].body' | grep -Fq "$MARKER"; then
            {
              echo "$MARKER"
              cat "$ATTEMPT_FILE"
            } > /tmp/attempt.md
            gh issue comment "$ISSUE" --repo "$UPSTREAM" --body-file /tmp/attempt.md
          fi

          echo "fork=$FORK" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Attempt is registered; fork is $FORK"

      - name: Implement, validate and push
        id: implement
        if: steps.task.outputs.mode == 'execute'
        env:
          UPSTREAM: ${{ steps.task.outputs.upstream }}
          FORK: ${{ steps.claim.outputs.fork }}
          BASE: ${{ steps.claim.outputs.base }}
          BRANCH: ${{ steps.task.outputs.branch }}
          ISSUE: ${{ steps.task.outputs.issue }}
          TASK_SCRIPT: ${{ steps.task.outputs.script }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TASK_SCRIPT"
          test -f "$GITHUB_WORKSPACE/$TASK_SCRIPT"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${FORK}.git" /tmp/bounty-work
          cd /tmp/bounty-work
          git remote add upstream "https://github.com/${UPSTREAM}.git" || true
          git fetch upstream "$BASE"
          git checkout -B "$BRANCH" "upstream/$BASE"
          git config user.name "jhhjwei"
          git config user.email "8869856+jhhjwei@users.noreply.github.com"

          bash "$GITHUB_WORKSPACE/$TASK_SCRIPT"
          git add -A
          git diff --cached --quiet && { echo "Task produced no changes"; exit 1; }
          git commit -m "chore: address bounty issue #${ISSUE}"
          git push --force origin "$BRANCH"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open or reuse pull request
        id: pr
        if: steps.task.outputs.mode == 'execute'
        env:
          OWNER: ${{ steps.auth.outputs.login }}
          UPSTREAM: ${{ steps.task.outputs.upstream }}
          BASE: ${{ steps.claim.outputs.base }}
          BRANCH: ${{ steps.task.outputs.branch }}
          PR_TITLE: ${{ steps.task.outputs.pr_title }}
          PR_BODY_FILE: ${{ steps.task.outputs.pr_body_file }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PR_BODY_FILE"
          test -f "$GITHUB_WORKSPACE/$PR_BODY_FILE"

          EXISTING=$(gh api --method GET "repos/${UPSTREAM}/pulls" \
            -f state=open \
            -f head="${OWNER}:${BRANCH}" \
            --jq '.[0].html_url // ""')

          if [ -n "$EXISTING" ]; then
            PR_URL="$EXISTING"
            echo "Pull request already open: $PR_URL"
          else
            PR_URL=$(gh pr create \
              --repo "$UPSTREAM" \
              --base "$BASE" \
              --head "$OWNER:$BRANCH" \
              --title "$PR_TITLE" \
              --body-file "$GITHUB_WORKSPACE/$PR_BODY_FILE")
            echo "Pull request created: $PR_URL"
          fi
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Publish runner status
        if: always()
        continue-on-error: true
        env:
          AUTH_RESULT: ${{ steps.auth.conclusion }}
          TASK_RESULT: ${{ steps.task.conclusion }}
          CLAIM_RESULT: ${{ steps.claim.conclusion }}
          IMPLEMENT_RESULT: ${{ steps.implement.conclusion }}
          PR_RESULT: ${{ steps.pr.conclusion }}
          PR_URL: ${{ steps.pr.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg auth "${AUTH_RESULT:-not_run}" \
            --arg task "${TASK_RESULT:-not_run}" \
            --arg claim "${CLAIM_RESULT:-not_run}" \
            --arg implement "${IMPLEMENT_RESULT:-not_run}" \
            --arg pr "${PR_RESULT:-not_run}" \
            --arg pr_url "${PR_URL:-}" \
            '{checked_at:$checked_at,run_id:$run_id,run_url:$run_url,auth:$auth,task:$task,claim:$claim,implement:$implement,pr:$pr,pr_url:$pr_url}' \
            > /tmp/bounty-status.json

          CONTENT=$(base64 -w 0 /tmp/bounty-status.json)
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.automation/bounty-status.json" --jq '.sha' 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.automation/bounty-status.json" \
              -f message="ci: record bounty runner status" \
              -f content="$CONTENT" \
              -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.automation/bounty-status.json" \
              -f message="ci: record bounty runner status" \
              -f content="$CONTENT" >/dev/null
          fi

          cat /tmp/bounty-status.json >> "$GITHUB_STEP_SUMMARY"
