name: Hourly income guard

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: hourly-income-guard
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Shanghai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run primary hourly guard
        id: guard
        shell: bash
        run: |
          set +e
          python3 scripts/hourly_income_guard.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Commit primary heartbeat and summaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opportunity-pipeline/health opportunity-pipeline/SUMMARY.md
          if git diff --cached --quiet; then
            echo "No heartbeat changes to commit"
          else
            git commit -m "health: record primary hourly income audit"
            git push
          fi

      - name: Enforce RED result
        if: steps.guard.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Hourly guard detected missing heartbeat, stale summaries, or no commercial action."
          exit 1
