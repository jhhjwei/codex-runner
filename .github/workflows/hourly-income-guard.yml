name: Hourly income guard

on:
  push:
    paths:
      - "scripts/hourly_income_guard.py"
      - "tests/test_hourly_income_guard.py"
      - ".github/workflows/hourly-income-guard.yml"
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: hourly-income-guard
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Shanghai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test guard boundaries
        run: python3 -m pytest -q tests/test_hourly_income_guard.py

      - name: Run read-only primary guard
        id: guard
        shell: bash
        run: |
          set +e
          python3 scripts/hourly_income_guard.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Commit audit and guard summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opportunity-pipeline/health/audit opportunity-pipeline/SUMMARY.md
          if git diff --cached --quiet; then
            echo "No audit changes to commit"
          else
            git commit -m "health: record read-only hourly income audit"
            git push
          fi

      - name: Record RED business result
        if: steps.guard.outputs.exit_code == '10'
        shell: bash
        run: |
          echo "::warning::Hourly guard is RED: missing heartbeat, stale summaries, or no commercial action."
          echo "Business RED was recorded without turning the workflow into a technical failure."

      - name: Enforce technical failures
        if: steps.guard.outputs.exit_code != '0' && steps.guard.outputs.exit_code != '10'
        shell: bash
        run: |
          echo "::error::Hourly income guard failed technically with exit code ${{ steps.guard.outputs.exit_code }}."
          exit 1
