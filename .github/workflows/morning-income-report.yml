name: Morning income report

on:
  schedule:
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: morning-income-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Shanghai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-heal and generate 08:00 primary heartbeat
        shell: bash
        run: |
          set +e
          python3 scripts/hourly_income_guard.py
          echo "hourly_guard_exit=$?"
          set -e

      - name: Generate repository-native overnight report
        shell: bash
        run: python3 scripts/generate_overnight_morning_report.py

      - name: Commit heartbeat, summary and report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opportunity-pipeline/health opportunity-pipeline/SUMMARY.md opportunity-pipeline/reports/morning
          if git diff --cached --quiet; then
            echo "No morning report changes to commit"
          else
            git commit -m "report: publish overnight first-income morning report"
            git push
          fi
