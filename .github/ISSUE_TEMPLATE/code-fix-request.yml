name: Maven 构建故障免费预检
description: 提交一个可复现的 Maven 或 Spring Boot 构建阻塞
title: "[Maven预检] "
body:
  - type: markdown
    attributes:
      value: |
        本预检只判断一个 Maven 构建阻塞能否复现并进入固定 65 美元服务。请勿提交密码、Cookie、Token、私钥、生产地址或真实个人数据。

  - type: dropdown
    id: failure_type
    attributes:
      label: 故障类型
      options:
        - Maven 依赖冲突或版本问题
        - Spring Boot 启动失败
        - Java / javax / jakarta 兼容问题
        - mvn test 或 mvn package 失败
        - ClassNotFoundException / NoSuchMethodError
        - 其他 Maven 构建故障
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: 失败命令
      placeholder: mvn clean test
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 完整错误日志
      description: 请粘贴脱敏后的完整错误，不要只提供截图中的一行。
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Java 与 Maven 版本
      placeholder: Java 17, Maven 3.9.9
    validations:
      required: true

  - type: input
    id: reproduction
    attributes:
      label: 公开仓库或脱敏最小复现
      placeholder: https://github.com/owner/repo
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我只要求修复上述一个构建阻塞，不包含部署、新功能或长期维护
          required: true
        - label: 我已移除密码、Token、Cookie、私钥、生产地址和个人数据
          required: true
